name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Icon Assets
        run: |
          set -e
          ICON_DIR="Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          cat > Resources/Assets.xcassets/Contents.json << 'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat > "$ICON_DIR/Contents.json" << 'EOF'
          {
            "images" : [
              {
                "filename" : "icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          if [ ! -f "$ICON_DIR/icon-1024.png" ]; then
            echo "生成占位图标..."
            python3 -c 'import zlib,struct;h=b"\x89PNG\r\n\x1a\n";c=lambda t,d:struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff);i=c(b"IHDR",struct.pack(">IIBBBBB",1024,1024,8,2,0,0,0));r=b"".join(b"\x00"+bytes([10,132,255])*1024 for _ in range(1024));d=c(b"IDAT",zlib.compress(r,9));e=c(b"IEND",b"");open("Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png","wb").write(h+i+d+e)'
          fi

          echo "===== 资源目录 ====="
          find Resources -type f
          ls -la "$ICON_DIR/icon-1024.png"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          set -e
          xcodebuild archive \
            -project MediaVault.xcodeproj \
            -scheme MediaVault \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/MediaVault.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Manually Embed AMSMB2.framework
        run: |
          set -e
          APP_PATH="build/MediaVault.xcarchive/Products/Applications/MediaVault.app"

          echo "===== 在 DerivedData 中搜索 AMSMB2.framework ====="
          FW_SRC=$(find ~/Library/Developer/Xcode/DerivedData -name "AMSMB2.framework" -type d 2>/dev/null | head -1)

          if [ -z "$FW_SRC" ]; then
            echo "❌ 找不到 AMSMB2.framework"
            find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "找到: $FW_SRC"
          ls -la "$FW_SRC"

          echo ""
          echo "===== 复制到 .app/Frameworks/ ====="
          mkdir -p "$APP_PATH/Frameworks"
          cp -R "$FW_SRC" "$APP_PATH/Frameworks/"
          ls -la "$APP_PATH/Frameworks"

          echo ""
          echo "===== 验证主二进制里的 rpath ====="
          otool -l "$APP_PATH/MediaVault" | grep -A2 LC_RPATH || true

          echo ""
          echo "===== 验证主二进制是否引用 AMSMB2 ====="
          otool -L "$APP_PATH/MediaVault" | grep -i amsmb2 || echo "(未直接引用，可能通过 @rpath)"

      - name: Verify Archive Contents
        run: |
          set -e
          APP_PATH="build/MediaVault.xcarchive/Products/Applications/MediaVault.app"

          echo "===== .app 内容 ====="
          ls -la "$APP_PATH"
          echo ""
          echo "===== .app 总大小 ====="
          du -sh "$APP_PATH"

          echo ""
          echo "===== Frameworks 检查 ====="
          test -d "$APP_PATH/Frameworks/AMSMB2.framework" || { echo "❌ AMSMB2.framework 未嵌入"; exit 1; }
          echo "✅ AMSMB2.framework 已嵌入"

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/MediaVault.xcarchive/Products/Applications/MediaVault.app"

          rm -rf Payload
          rm -f MediaVault.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MediaVault.ipa Payload

          echo "===== IPA 大小 ====="
          ls -lh MediaVault.ipa
          echo ""
          echo "===== IPA 内容 ====="
          unzip -l MediaVault.ipa | head -80

          IPA_SIZE=$(stat -f%z MediaVault.ipa)
          if [ "$IPA_SIZE" -lt 200000 ]; then
            echo "❌ IPA 小于 200 KB，异常（预期 ~300 KB）"
            exit 1
          fi
          echo "✅ IPA 打包成功（${IPA_SIZE} 字节）"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-IPA
          path: MediaVault.ipa
          if-no-files-found: error
