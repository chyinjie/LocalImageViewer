- name: Ensure App Icon Exists
        run: |
          ICON_PATH="Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$ICON_PATH" ]; then
            echo "图标不存在，生成占位图标..."
            mkdir -p "$(dirname "$ICON_PATH")"
            python3 -c "
import zlib, struct
def chunk(t, d):
    c = t + d
    return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
header = b'\x89PNG\r\n\x1a\n'
ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 1024, 1024, 8, 2, 0, 0, 0))
raw = b''
for y in range(1024):
    raw += b'\x00' + bytes([10, 132, 255]) * 1024
idat = chunk(b'IDAT', zlib.compress(raw, 9))
iend = chunk(b'IEND', b'')
open('$ICON_PATH', 'wb').write(header + ihdr + idat + iend)
"
          fi
          ls -la "$ICON_PATH"
