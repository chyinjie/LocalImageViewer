name: MediaVault

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    branch: master

targets:
  MediaVault:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: AMSMB2

    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaVault
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # 注意：不要在这里写 CODE_SIGNING_*，交由命令行控制
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  MediaVault:
    build:
      targets:
        MediaVault: all
    run:
      config: Debug
    archive:
      config: Release
