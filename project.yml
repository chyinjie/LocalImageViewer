name: MediaVault
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    version: 3.0.2
targets:
  MediaVault:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: AMSMB2
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaVault
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"  # 关键！禁用编译优化，避免第三方库类型丢失报错
    scheme: {}
