name: MediaVault
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    branch: main
targets:
  MediaVault:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: AMSMB2
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaVault
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: 5.0
    scheme: {}
